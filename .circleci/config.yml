version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.8

    steps:
      - checkout

      - restore_cache:
          key: deps-{{ checksum "requirements.txt" }}

      - run:
          command: |
            pip install -r requirements.txt

      - save_cache:
          key: deps-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

      - run:
          command: |
            python -m unittest discover -s tests -v

workflows:
  version: 2
  all:
    jobs:
      - test
